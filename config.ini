[EGMV_Settings]
; Educational Game Memory Visualizer (EGMV) - Configuration
; Version 1.0 - Academic Use Only

[Process]
TargetProcess = cs2.exe
ClientDll = client.dll

[Offsets]
; Hinweis für Studenten: Die folgenden Offsets müssen regelmäßig aktualisiert werden.
; Diese können aus öffentlichen Schema-Dumps oder durch eigenes Reverse Engineering ermittelt werden.
; Platzhalterwerte dienen nur zur Veranschaulichung der Struktur.

dwLocalPlayerPawn = 0x1234567
dwEntityList = 0x2345678
dwViewMatrix = 0x3456789

; Member Offsets (Netvars/Schema)
m_iHealth = 0x32C
m_iTeamNum = 0x3BF
m_vOldOrigin = 0x1224
m_pGameSceneNode = 0x310
m_modelState = 0x160
m_hPlayerPawn = 0x7BC
m_iszPlayerName = 0x630

[Patterns]
; Beispiel-Patterns für das dynamische Suchen von Offsets (Signature Scanning)
; Studenten können hier Byte-Folgen eintragen, um die Robustheit des Tools zu erhöhen.
; Beispiel-Signaturen (Platzhalter für pädagogische Zwecke):
dwLocalPlayerPawn_Pattern = 48 8B 05 ? ? ? ? 48 85 C0 74 4F
dwEntityList_Pattern = 48 8B 0D ? ? ? ? 48 89 7C 24 ? 8B 0D
dwViewMatrix_Pattern = 48 8D 0D ? ? ? ? 48 C1 E0 06

[Visuals]
Show2DBox = True
Show3DBox = True
ShowHealthBar = True
ShowNameTag = True
ShowDistance = True
ShowSnaplines = True
UpdateInterval = 0.05
; Rendering Verzögerung in Sekunden (Demonstration von Performance-Optimierung)
RenderDelayMin = 0.04
RenderDelayMax = 0.12
